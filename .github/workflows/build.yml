          @Composable
          fun Lyrics(vm: Vm) {
              if (vm.lyrics.isEmpty()) {
                  Text("No synced lyrics found", color = MaterialTheme.colorScheme.onSurfaceVariant)
                  return
              }
              val st = rememberLazyListState()
              val idx = vm.lyrics.indexOfLast { it.first <= vm.pos }.coerceAtLeast(0)
              LaunchedEffect(idx) { st.animateScrollToItem((idx - 2).coerceAtLeast(0)) }
              LazyColumn(state = st, modifier = Modifier.fillMaxSize()) {
                  itemsIndexed(vm.lyrics) { i, l ->
                      Text(
                          l.second, Modifier.padding(vertical = 8.dp).clickable { vm.seek(l.first) },
                          style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.Bold,
                          color = if (i == idx) MaterialTheme.colorScheme.primary
                          else MaterialTheme.colorScheme.onSurface.copy(alpha = 0.4f)
                      )
                  }
              }
          }
          EOF
          touch .v5 .changed
          fi
       - name: Fix Prefs setter clash
        run: |
          sed -i 's/\bsetTheme(/applyTheme(/g; s/\bsetMode(/applyMode(/g; s/\bsetFont(/applyFont(/g; s/\bsetCustom(/applyCustom(/g' app/src/main/java/app/tunes/Themes.kt
          touch .changed
          
      - name: Fetch Google Sans fonts
        run: |
          mkdir -p app/src/main/assets/fonts
          if [ -z "$(ls app/src/main/assets/fonts)" ]; then
          python3 -m venv /tmp/v && /tmp/v/bin/pip install -q fonttools
          /tmp/v/bin/python - <<'PY'
          import urllib.request
          from fontTools.ttLib import TTFont
          for k, fid in {"gs": "google-sans", "gsf": "google-sans-flex", "gsc": "google-sans-code"}.items():
              for w in (400, 500, 700):
                  u = f"https://cdn.jsdelivr.net/fontsource/fonts/{fid}@latest/latin-{w}-normal.woff"
                  try:
                      open("/tmp/f.woff", "wb").write(urllib.request.urlopen(u, timeout=30).read())
                      f = TTFont("/tmp/f.woff"); f.flavor = None
                      f.save(f"app/src/main/assets/fonts/{k}-{w}.ttf"); print("ok", k, w)
                  except Exception as e:
                      print("skip", k, w, e)
          PY
          [ -n "$(ls app/src/main/assets/fonts)" ] && touch .changed || true
          fi
      - name: Ensure palette dependency
        run: |
          F=$(ls app/build.gradle.kts app/build.gradle 2>/dev/null | head -1)
          if ! grep -q "androidx.palette" "$F"; then
            if [[ "$F" == *.kts ]]; then L='    implementation("androidx.palette:palette-ktx:1.0.0")'; else L="    implementation 'androidx.palette:palette-ktx:1.0.0'"; fi
            sed -i "0,/^dependencies {/s//dependencies {\n$L/" "$F"
            touch .changed
          fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tunes-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Commit updated sources
        run: |
          if [ -f .changed ]; then
            rm .changed
            git config user.name github-actions
            git config user.email actions@github.com
            git add -A
            git commit -qm "tunes v5"
            git push
          fi
